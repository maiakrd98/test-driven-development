name: Unit and functional tests

on:
  push:
  pull_request:

jobs:
  run_func_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          init-shell: bash
      - run: bash test/func/test_fire_gdp.sh
        shell: bash -l {0}

  run_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          init-shell: bash
      - run: python -m unittest discover -s test/unit
        shell: bash -l {0}

  run_pycodestyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          init-shell: bash
      - run: pycodestyle $(git ls-files "*.py")
        shell: bash -l {0}